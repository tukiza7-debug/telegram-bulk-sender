name: telegram_bulk_sender
description: "Bulk sender for Telegram bots — send photos, videos and documents to multiple chats with progress, retry and rate limiting."
publish_to: "none"
version: 1.2.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  # Navigation
  go_router: ^14.8.1
  # Networking (Telegram Bot API + GitHub Releases)
  dio: ^5.7.0
  # Media (photos via system Photo Picker; videos + documents via SAF picker)
  image_picker: ^1.1.2
  file_picker: ^8.3.7
  flutter_image_compress: ^2.3.0
  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  # Platform integration
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.10.10
  flutter_foreground_task: ^8.17.0
  package_info_plus: ^8.1.2
  # Utils
  crypto: ^3.0.6
  intl: ^0.20.2
  material_symbols_icons: ^4.2815.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # file_picker 8.3.7 compiles its Android module against SDK 34, while
  # flutter_plugin_android_lifecycle >= 2.0.22 ships AAR metadata demanding
  # compileSdk 36 — which fails ':file_picker:checkReleaseAarMetadata'.
  # 2.0.20 is the newest release that still targets SDK 34; it satisfies
  # every consumer's ^2.0.x constraint.
  flutter_plugin_android_lifecycle: 2.0.20

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
