name: CLI quality gates

# Gate for the Python CLI/library under cli/. Path-filtered so the Android
# app release workflow (release.yml) is untouched.
on:
  push:
    branches: [main]
    paths: ['cli/**', '.github/workflows/cli.yml']
  pull_request:
    paths: ['cli/**', '.github/workflows/cli.yml']

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: lint + strict types + tests + coverage floors + secret scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: cli/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint (ruff)
        run: ruff check .

      - name: Format (ruff)
        run: ruff format --check .

      - name: Strict type check (mypy)
        run: mypy

      - name: Secret scan
        run: python scripts/secret_scan.py ..

      - name: Tests with coverage (no real network; suite blocks non-loopback sockets)
        run: >
          python -m pytest
          --cov=telegram_bulk_image_sender --cov-branch --cov-report=term
          --cov-report=json:coverage.json

      - name: Coverage floor (overall >= 80%)
        run: python -m coverage report --fail-under=80

      - name: Coverage floor (retry/backoff, escaping, rate limiting, state == 100%)
        run: >
          python -m coverage report
          --include="*/backoff.py,*/ratelimit.py,*/captions.py,*/state.py"
          --fail-under=100

      - name: Perf sanity (slow marker)
        run: python -m pytest -m slow -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: cli-coverage-${{ matrix.python-version }}
          path: cli/coverage.json
